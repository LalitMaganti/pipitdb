[workspace]
resolver = "3"
members = ["crates/kernel"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/LalitMaganti/pipitdb"
rust-version = "1.98"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

# TigerStyle: the strictest warnings, from day one. See AGENTS.md.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
# Assertions check invariants on every path; documenting each one as a
# `# Panics` section would bury the real API contracts.
missing_panics_doc = "allow"
# `assert_eq!` formats both sides with `Debug` on failure, which costs
# binary size; plain `assert!(a == b)` does not.
manual_assert_eq = "allow"
unwrap_used = "warn"
expect_used = "warn"
