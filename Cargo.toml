[workspace]
resolver = "3"
members = ["crates/bench", "crates/diagnostics", "crates/file", "crates/kernel", "crates/operators", "crates/parquet", "crates/parquet-full", "crates/pipesql", "crates/s3"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/LalitMaganti/pipitdb"
rust-version = "1.98"

[profile.dev]
panic = "abort"

# Built as profiling is, so benchmarks count what development measures.
# gungraun finds benchmark functions by their symbols.
[profile.bench]
opt-level = 3
lto = "thin"
strip = false
debug = true

# What ships, so what the size budget measures. Fat LTO optimizes all crates
# as one, which thin LTO can't, but makes rebuilds up to 47% slower.
[profile.release]
panic = "abort"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

# For final speed numbers, such as the ClickBench scoreboard's: release,
# built for speed rather than size.
[profile.speed]
inherits = "release"
opt-level = 3

# For developing, debugging and profiling: speed with thin LTO, which
# rebuilds faster, and line tables for profilers.
[profile.profiling]
inherits = "speed"
lto = "thin"
strip = false
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
# Pedantic lints that ask for boilerplate rather than catch bugs.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# `assert_eq!` formats with `Debug`, which costs binary size.
manual_assert_eq = "allow"
