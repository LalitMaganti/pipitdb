[workspace]
resolver = "3"
members = ["crates/kernel"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/LalitMaganti/pipitdb"
rust-version = "1.98"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

# Strict lints, per TigerStyle.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
# Pedantic lints that ask for boilerplate rather than catch bugs.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# `assert_eq!` formats with `Debug`, which costs binary size.
manual_assert_eq = "allow"
