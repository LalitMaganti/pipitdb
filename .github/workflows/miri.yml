name: Miri

# Miri takes far longer than the rest of CI, so it runs once a day on main,
# and by hand, rather than on every push.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pinned so Miri's standard library build can be cached.
  MIRI_NIGHTLY: nightly-2026-09-27

jobs:
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.MIRI_NIGHTLY }}
          components: miri,rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # The profiles live in the root Cargo.toml, which rust-cache doesn't hash.
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/miri
          key: miri-${{ env.MIRI_NIGHTLY }}
      - run: cargo +$MIRI_NIGHTLY miri test
