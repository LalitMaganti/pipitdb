name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test
      - run: cargo build --release --target wasm32-unknown-unknown

  size:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: wasm32-unknown-unknown }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo clippy -p pipitdb-size --target ${{ matrix.target }}
      # `shell: bash` sets pipefail, so `tee` doesn't hide a failure.
      - shell: bash
        run: crates/size/check.sh ${{ matrix.target }} | tee -a "$GITHUB_STEP_SUMMARY"

  # Fails a PR whose benchmarks run more than 5% more instructions than its base.
  instructions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: rustup toolchain install
      # Must match the gungraun version in Cargo.lock.
      - run: cargo install gungraun-runner --version 0.20.0 --locked
      - name: Measure the base
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          if [ -f crates/bench/benches/instructions.rs ]; then
            cargo bench -p pipitdb-bench --bench instructions -- --save-baseline=base
          fi
          git checkout ${{ github.event.pull_request.head.sha }}
      - name: Compare against the base
        run: |
          if [ -d target/gungraun ]; then
            cargo bench -p pipitdb-bench --bench instructions -- --baseline=base --callgrind-limits='ir=5%'
          else
            cargo bench -p pipitdb-bench --bench instructions
          fi

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - run: cargo +nightly miri test
