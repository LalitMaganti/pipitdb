name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push to a pull request cancels its run before, which it supersedes. Each
# push to main gets its own, so every commit there is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # The profiles live in the root Cargo.toml, which rust-cache doesn't hash.
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - run: cargo fmt --check
      # Warnings are denied here rather than by RUSTFLAGS, which would replace
      # .cargo/config.toml's.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets -p pipitdb-pipesql --features diagnostics -- -D warnings
      - run: cargo test
      - run: cargo test -p pipitdb-pipesql --features diagnostics
      # Small blocks, so the tests also cover growing and running out of them,
      # and shallow nesting and plans, so they cover setting them.
      - run: cargo test -p pipitdb-pipesql
        env:
          PIPIT_AST_BLOCK_BYTES: 4096
          PIPIT_AST_BLOCK_SLOTS: 4
          PIPIT_NESTING_MAX: 64
          PIPIT_PLAN_DEPTH_MAX: 64
      - run: cargo build --release --target wasm32-unknown-unknown --workspace

  # The engine on Windows, where files work differently. The benchmarks are
  # left out: one of their dependencies needs a C compiler there.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - run: cargo test -p pipitdb-kernel -p pipitdb-file -p pipitdb-pipesql -p pipitdb-diagnostics

  # The engine where a pointer is 32 bits, as in Wasm and on microcontrollers.
  i686:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - uses: ./.github/actions/setup-rust
      - run: rustup target add i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - run: >-
          cargo test --target i686-unknown-linux-gnu
          -p pipitdb-kernel -p pipitdb-file -p pipitdb-pipesql -p pipitdb-parquet

  size:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: wasm32-unknown-unknown }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}-${{ hashFiles('Cargo.toml') }}
      - run: cargo clippy -p pipitdb-bench --example size --features size --target ${{ matrix.target }} -- -D warnings
      # `shell: bash` sets pipefail, so `tee` doesn't hide a failure.
      - shell: bash
        run: crates/bench/check_size.sh ${{ matrix.target }} | tee -a "$GITHUB_STEP_SUMMARY"

  # Fails if a benchmark's instruction count is more than 1% off
  # crates/bench/instructions/ci.json.
  instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: valgrind
      - uses: ./.github/actions/setup-rust
      # Also caches the gungraun-runner binary, so installing it is quick.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # The profiles live in the root Cargo.toml, which rust-cache doesn't hash.
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      # Must match the gungraun version in Cargo.lock.
      - run: cargo install gungraun-runner --version 0.20.0 --locked
      # ClickBench's first file, for its queries' benchmarks: downloaded from
      # ClickBench once, checked, then cached by its checksum. Outside
      # target, which rust-cache prunes.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/clickbench
          key: clickbench-${{ hashFiles('crates/bench/clickbench/hits_0.sha256') }}
      - run: crates/bench/clickbench/fetch.sh "${{ runner.temp }}/clickbench"
      # TPC-H's and TPC-DS's data at scale 0.01, for their queries'
      # benchmarks: generated by a pinned DuckDB, the same each time, then
      # cached by the script that generates it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: tpc
        with:
          path: ${{ runner.temp }}/tpc
          key: tpc-duckdb-1.5.6-${{ hashFiles('crates/bench/tpc/generate.py') }}
      - if: steps.tpc.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install duckdb==1.5.6
          "$RUNNER_TEMP/venv/bin/python" crates/bench/tpc/generate.py "$RUNNER_TEMP/tpc" --scale 0.01
      # Clear summaries the cache may have restored from earlier runs.
      - run: rm -rf target/gungraun && cargo bench -p pipitdb-bench --bench instructions -- --save-summary=json
        env:
          PIPIT_CLICKBENCH: ${{ runner.temp }}/clickbench
          PIPIT_TPC: ${{ runner.temp }}/tpc
      - run: crates/bench/check_instructions.py | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
