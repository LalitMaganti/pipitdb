[package]
name = "pipitdb-kernel"
description = "The pipitdb kernel: buffers, columns, batches, and pipelines that run them."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "pipit_kernel"

[features]
# Failed checks in release builds say their line: see `check`.
check-lines = []
# `Prepared::explain`, and the names of steps it writes.
explain = []
# Aggregations that write rows to an `Env`'s `SpillStore` once they can't
# hold more groups, rather than fail.
spill = []
# `Global::current`, each thread's `Global`, which needs `std`.
std = []

[lints]
workspace = true
