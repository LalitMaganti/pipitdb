[package]
name = "pipitdb-bench"
description = "Benchmarks for pipitdb: speed, instructions and binary size."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pipitdb-kernel = { path = "../kernel" }
pipitdb-parquet = { path = "../parquet" }
pipitdb-pipesql = { path = "../pipesql" }

# Not for Wasm, which only builds the size example.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
gungraun = "0.20"
pipitdb-file = { path = "../file" }
pipitdb-parquet-full = { path = "../parquet-full", features = ["snappy-cpp"] }
pipitdb-regex = { path = "../regex", default-features = false, features = ["full"] }

[features]
default = ["check-lines", "string-functions"]
# Failed checks say their line, as in every build of ours but the size
# example, which measures what an embedder ships.
check-lines = ["pipitdb-kernel/check-lines"]
# The string functions, which ClickBench calls, and the size example
# leaves out.
string-functions = ["pipitdb-pipesql/string-functions"]
# Builds the size example, which `cargo test` can't: it has no unwinding.
size = []
# Lets the suite example spill, to where `SPILL` says, and the spill cases
# example spill to memory.
spill = ["pipitdb-kernel/spill"]

# A library that uses the kernel, whose size CI checks against `sizes`.
[[example]]
name = "size"
crate-type = ["cdylib"]
required-features = ["size"]

[[bench]]
name = "wall_clock"
harness = false

[[bench]]
name = "instructions"
harness = false

[lints]
workspace = true
