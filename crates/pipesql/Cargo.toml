[package]
name = "pipitdb-pipesql"
description = "PipeSQL for pipitdb: lexing, parsing and stages."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "pipit_pipesql"

[dependencies]
pipitdb-diagnostics = { path = "../diagnostics", optional = true }
pipitdb-kernel = { path = "../kernel" }
pipitdb-operators = { path = "../operators" }

[features]
# Error messages, and `pipit-explain` to print them.
diagnostics = ["dep:pipitdb-diagnostics"]

[[bin]]
name = "pipit-explain"
path = "src/bin/explain.rs"
required-features = ["diagnostics"]

[lints]
workspace = true
