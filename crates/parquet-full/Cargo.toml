[package]
name = "pipitdb-parquet-full"
description = "What pipitdb's small Parquet reader leaves out, such as compression."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "pipit_parquet_full"

[dependencies]
pipitdb-parquet = { path = "../parquet" }
snap = "1"
snappy_src = { version = "0.2", optional = true }

[features]
# Snappy through Google's C++ library, which decompresses faster than snap
# but needs a C++ compiler, and doesn't build for Wasm.
snappy-cpp = ["dep:snappy_src"]

[dev-dependencies]
pipitdb-file = { path = "../file" }
pipitdb-kernel = { path = "../kernel" }

[lints]
workspace = true
